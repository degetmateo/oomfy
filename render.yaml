services:
  - type: web
    name: oomfy-web
    runtime: static
    buildCommand: pnpm --filter @oomfy/shared build && pnpm --filter @oomfy/web build
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self';script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;font-src 'self' https://fonts.gstatic.com data:;img-src 'self' data: blob: https:;media-src 'self' blob: https:;connect-src 'self' blob: data: https://oomfy.online https://api.oomfy.online wss://api.oomfy.online https://*.oomfy.online wss://*.oomfy.online https://oomfy.onrender.com https://*.onrender.com https://cloudflareinsights.com https://*.cloudflareinsights.com;frame-src 'self' https://open.spotify.com https://www.youtube.com https://youtube.com https://www.tiktok.com;worker-src 'self' blob:;manifest-src 'self';frame-ancestors 'self';object-src 'none';base-uri 'self';form-action 'self';upgrade-insecure-requests
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /index.html
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
