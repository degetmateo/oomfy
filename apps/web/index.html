<!DOCTYPE html>
<html lang="es" class="dark" style="background-color:#141414;color:#eaeaea">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <title>oomfy</title>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/assets/oomfy-logo-no-bg.png" />
    <link rel="apple-touch-icon" href="/assets/oomfy-logo-black-bg.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://api.oomfy.online" crossorigin />
    <meta name="theme-color" content="#00dc65" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="oomfy" />
    <style>
      html, body { margin: 0; padding: 0; background-color: #141414; color: #eaeaea; }
      #oomfy-boot-loader { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #141414; font-family: monospace, sans-serif; }
      .oomfy-boot-brand { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: 0.05em; }
      .oomfy-boot-spin { width: 28px; height: 28px; border: 2px solid #2a2a2a; border-top-color: #00dc65; border-radius: 9999px; animation: oomfy-spin .8s linear infinite; }
      @keyframes oomfy-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="background-color:#141414;color:#eaeaea;margin:0" class="bg-dark-bg text-dark-text antialiased selection:bg-brand-500 selection:text-white">
    <div id="root">
      <div id="oomfy-boot-loader" role="status" aria-label="Cargando oomfy">
        <div class="oomfy-boot-brand">
          <img src="/assets/oomfy-logo-no-bg.png" alt="oomfy" width="40" height="40" fetchpriority="high" />
          <span>oomfy</span>
        </div>
        <div class="oomfy-boot-spin" aria-hidden="true"></div>
        <p style="margin:0;font-size:12px;color:#8e8e8e">Cargando oomfy...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
